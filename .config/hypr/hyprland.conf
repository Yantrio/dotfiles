autogenerated = 0

################
### MONITORS ###
################

monitor=DP-1, preferred, 0x0, 1
monitor=DP-3, preferred, 3840x0, 1
monitor=DP-2, preferred, 7680x0, 1


###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = dolphin
# $menu removed — noctalia's launcher replaces the custom rust one (SUPER+SPACE)


#################
### AUTOSTART ###
#################

# noctalia provides the bar, notifications, lock screen and idle management.
# It replaces waybar + swaync + hypridle + hyprlock (those packages are still
# installed; re-enable them here if rolling back).
exec-once = noctalia
exec-once = systemctl --user start hyprpolkitagent # polkit agent

############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 30

    border_size = 2

    col.active_border = rgba(7e9cd8ee) rgba(7fb4caee) 45deg
    col.inactive_border = rgba(363646aa)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.9

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 25
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    background_color = rgba(1f1f28ff)
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen,

# Noctalia shell — panels, session, screenshots
bind = $mainMod, SPACE, exec, noctalia msg panel-toggle launcher
bind = $mainMod, C, exec, noctalia msg panel-toggle control-center
bind = $mainMod, comma, exec, noctalia msg settings-toggle
bind = ALT, Tab, exec, noctalia msg window-switcher
bind = $mainMod, L, exec, noctalia msg session lock
bind = , Print, exec, noctalia msg screenshot-region
bind = SHIFT, Print, exec, noctalia msg screenshot-fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# multimedia keys for volume and LCD brightness
# Routed through noctalia so its OSD shows on change
bindel = ,XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindel = ,XF86AudioLowerVolume, exec, noctalia msg volume-down
bindel = ,XF86AudioMute, exec, noctalia msg volume-mute
bindel = ,XF86AudioMicMute, exec, noctalia msg mic-mute
bindel = ,XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindel = ,XF86MonBrightnessDown, exec, noctalia msg brightness-down

# Media — noctalia's own player control, no playerctl needed
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPause, exec, noctalia msg media toggle
bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioPrev, exec, noctalia msg media previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0


# Noctalia surfaces: blur them, and skip Hyprland's animations since the shell
# animates its own layers (double-animating causes visible jitter).
layerrule = blur on, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = ignore_alpha 0.1, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = no_anim on, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
