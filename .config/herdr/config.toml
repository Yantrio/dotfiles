onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[theme.custom]
# herdr's built-in "kanagawa" maps surface_dim too close to the pane background,
# making pane dividers invisible. Bumping to Fuji Grey so borders show up.
surface_dim = "#727169"   # Fuji Grey — pane divider

# NOTE: the selected-workspace / selected-agent highlight background is
# hardcoded in herdr (same grey across every built-in theme). Not overridable
# via [theme.custom] — the 16 exposed slots (accent, panel_bg, surface0/1,
# surface_dim, overlay0/1, text, subtext0, mauve, green, yellow, red, blue,
# teal, peach) have all been tested. File upstream at
# github.com/herdrdev/herdr if we want this exposed.
