onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[theme.custom]
# herdr's built-in "kanagawa" theme sets `surface_dim` too close to the pane
# background, making pane dividers invisible. Bumping to Fuji Grey so they show.
# Empirically verified: `surface_dim` is the slot that drives the border line.
surface_dim = "#727169"   # Fuji Grey — visible but tasteful
